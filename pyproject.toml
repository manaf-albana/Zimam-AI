[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zimam"
version = "0.1.0"
description = "Discover GUI capabilities with an NVIDIA VLM, compile them, replay without a model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "jinja2>=3.1",
  "playwright>=1.48",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "pyright>=1.1.390",
]

[project.scripts]
zimam = "zimam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zimam"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "demo", "operator_console", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "demo", "operator_console", "tests"]
venvPath = "."
venv = ".venv"
